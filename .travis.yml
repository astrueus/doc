os: linux
dist: focal

language: go
go:
  - "1.25.0"

arch:
- amd64

env:
- GO111MODULE=on CGO_ENABLED=1

install:
  - go mod tidy -v

before_install:
  - whereis gcc
  - go env

script:
  - go build -o doc_linux_amd64 -ldflags "-w" ./cmd/doc
  - cp conf/app.conf.example conf/app.conf
  - ./doc_linux_amd64 version
  - rm conf/app.conf

before_deploy:
  - go mod tidy -v && GOARCH=amd64 GOOS=linux go build -o doc_linux_amd64 -ldflags="-w -X 'git.itopcms.com/jackliu/doc/internal/config.VERSION=$TRAVIS_TAG' -X 'git.itopcms.com/jackliu/doc/internal/config.BUILD_TIME=`date`' -X 'git.itopcms.com/jackliu/doc/internal/config.GO_VERSION=`go version`'" ./cmd/doc
  # remove source / CI scaffolding; keep runtime + deployments
  - rm -f appveyor.yml .travis.yml .gitattributes .gitignore go.mod go.sum README.md
  - rm -rf cache cmd internal pkg .git .github scripts docs
  - ls -alh
  - cp conf/app.conf.example conf/app.conf
  - zip -r doc_linux_amd64.zip conf web uploads lib deployments doc_linux_amd64 LICENSE.md

deploy:
  provider: releases
  token: $CI_USER_TOKEN
  cleanup: true
  overwrite: true
  file:
    - doc_linux_amd64.zip
  on:
    tags: true
    branch: master
