version: "3.8"

services:
  doc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        TAG: "dev"
    image: doc:latest
    container_name: doc
    restart: always
    ports:
      - "8181:8181"
    volumes:
      # 配置与持久化数据（工作目录内相对路径）
      - ../conf:/doc/conf
      - ../web/static:/doc/web/static
      - ../web/views:/doc/web/views
      - ../uploads:/doc/uploads
      - ../runtime:/doc/runtime
      # 可选：宿主机同步目录（供 start.sh / sync_host.sh 使用）
      - doc-sync:/doc-sync-host
    environment:
      - DOC_HOME=/doc
      # 容器内监听所有网卡，便于宿主机通过端口映射访问
      - MINDOC_ADDR=0.0.0.0
      # Beego / 业务环境变量按需覆盖 conf/app.conf 中的 ${VAR||default}
      # 本地 compose 默认用 sqlite，避免容器内连不上宿主机 MySQL
      - MINDOC_DB_ADAPTER=sqlite3
      - MINDOC_DB_DATABASE=./database/mindoc.db
      # - MINDOC_RUN_MODE=prod
      # - MINDOC_DB_ADAPTER=mysql
      # - MINDOC_DB_HOST=host.docker.internal
      # - MINDOC_DB_DATABASE=doc
    # 默认入口是 deployments/start.sh；需要仅跑 web 时可改为:
    # command: ["/doc/doc", "web"]

volumes:
  doc-sync:
